name: Keep saved data warm

# GitHub deletes a saved cache that hasn't been used for 7 days. The weekly Thursday
# build is right on that edge, so this tiny job touches the cache every Monday.
# It never contacts the football data sources and doesn't publish anything.
on:
  schedule:
    - cron: "17 9 * * 1"     # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write             # only to keep both scheduled workflows enabled

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore (= touch) the saved data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830     # v4
        with:
          path: |
            data/cache
            site/data
          key: data-v2-touch
          restore-keys: data-v2-
      - name: Keep the scheduled workflows enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/enable"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keep-cache.yml/enable"
