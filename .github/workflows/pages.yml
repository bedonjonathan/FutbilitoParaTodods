name: Update data & publish site

on:
  schedule:
    - cron: "43 12 * * 4"   # every Thursday 12:43 UTC (GitHub schedules are always UTC)
  workflow_dispatch:          # "Run workflow" button = update now
  push:
    branches: [claude/gifted-newton-4rhrne, main]
    paths: ["backend/**", "frontend/**", "tests/**", ".github/workflows/pages.yml", "requirements*.txt"]
  pull_request:               # tests only (e.g. Dependabot updates); never publishes

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write          # only for the keep-alive step below
    steps:
      # Actions are pinned to exact commits (the comment shows the release tag)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0      # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Tests (a failure here stops the publish, so the last good site stays up)
        run: python -m pytest -q

      # Saved between runs: downloaded data files, the model test's finished weeks and the
      # published pages. So each Thursday only asks the sources for what is new, only the
      # new week is computed, and finished seasons are reused. (keep-cache.yml stops GitHub
      # from deleting this cache, which it does after 7 days without use.)
      - if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9             # v6.1.0
        with:
          path: |
            data/cache
            site/data
          key: data-v2-${{ github.run_id }}
          restore-keys: data-v2-

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0

      # --restore-from: if the cache was lost anyway, last week's pages are copied from the
      # live site first, so a failed download still falls back to them.
      - name: Download new data, fit models, write JSON
        if: github.event_name != 'pull_request'
        run: python -m backend.export --out site --restore-from "${{ steps.pages.outputs.base_url }}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

      # GitHub switches off scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow resets that clock, so the Thursday update keeps running.
      - name: Keep the weekly schedule alive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/enable"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keep-cache.yml/enable"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346      # v5.0.1
